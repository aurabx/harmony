apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harmony-proxy.fullname" . }}-config
  labels:
    {{- include "harmony-proxy.labels" . | nindent 4 }}
data:
  harmony-config.toml: |
    # Add your harmony-proxy configuration here
    # This is a placeholder - replace with actual config
    
    [[networks]]
    name = "default"
    
    [networks.http]
    bind_address = "0.0.0.0"
    bind_port = 8080
    
    [[groups]]
    name = "default-group"
    networks = ["default"]
