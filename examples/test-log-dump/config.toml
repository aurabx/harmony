# Test configuration demonstrating the log_dump middleware
# This configuration sets up a simple endpoint that dumps request/response data

[proxy]
id = "test-log-dump"
pipelines_path = "pipelines"
transforms_path = "transforms"

[logging]
log_level = "debug"
log_to_file = true
log_file_path = "./tmp/harmony.log"

[management]
enabled = true
base_path = "admin"
network = "management"

# Networks
[network.http_network]
enable_wireguard = false
interface = ""

[network.http_network.http]
bind_address = "127.0.0.1"
bind_port = 8080

# Management network
[network.management]
enable_wireguard = false
interface = ""

[network.management.http]
bind_address = "127.0.0.1"
bind_port = 8081

# Middleware
[middleware.debug_dump]
type = "log_dump"
[middleware.debug_dump.options]
apply = "both"
pretty = true
redact_headers = ["authorization", "cookie"]
redact_metadata = ["api_key", "token"]
redact_data_fields = ["ssn", "password", "user.payment_details"]
label = "test_dump"

# Endpoint
[endpoints.passthrough_endpoint]
service = "http"
[endpoints.passthrough_endpoint.options]
path_prefix = "/test"

# Backend
[backends.http_backend]
service = "http"
[backends.http_backend.options]
base_url = "https://httpbin.org"
timeout_secs = 30

# Services
[services.http]
module = ""