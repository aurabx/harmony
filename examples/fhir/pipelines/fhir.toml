# ------------------------
# Endpoint groups
#-------------------------
[pipelines.fhir]
description = "FHIR passthru test"
networks = ["http_net"]
endpoints = ["fhir_test"]
middleware = [
    "basic_auth",
]
backends = ["fhir_backend"]

# ------------------------
# Middleware
#-------------------------

[middleware.basic_auth]
type = "basic_auth"
[middleware.basic_auth.options]
token_path = "./tmp/test_token"
username = "test_user"
password = "test_password"

[middleware.json_extractor]
type = "json_extractor"

# ------------------------
# Endpoints
#-------------------------
[endpoints.fhir_test]
service = "fhir"
[endpoints.fhir_test.options]
path_prefix = "/fhir"

# ------------------------
# Backends
#-------------------------
[backends.fhir_backend]
service = "fhir"
[backends.fhir_backend.options]
base_url = "https://server.fire.ly/r4"
