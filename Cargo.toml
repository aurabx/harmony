[workspace]
members = [
    "crates/*",
]
resolver = "2"

[package]
name = "harmony"
version = "0.10.1"
edition = "2021"

[lib]
name = "harmony"
path = "src/lib.rs"

[dependencies]
dimse = { path = "crates/dimse" }
dicom_json_tool = { path = "crates/dicom_json_tool" }
harmony_transform = { path = "crates/transform" }
harmony-filesystem = { path = "crates/filesystem" }
harmony-database = { path = "crates/database" }

#jmix-rs = { path = "../jmix/jmix-rust" }
jmix-rs = "0.3"
#runbeam-sdk = { path = "../runbeam-sdk" }
runbeam-sdk = "0.9.1"

dicom-object = "0.9"
dicom-pixeldata = { version = "0.9", features = ["image", "rle", "jpeg"] }
dicom-core = "0.9"
dicom-dictionary-std = "0.9"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

tokio = { version = "1", features = ["full"] }
axum = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tower = "0.5.2"
futures-util = "0.3"
async-trait = "0.1"
toml = "0.8.22"
tracing-subscriber = { version = "0.3.20", features = ["registry", "env-filter"] }
jsonwebtoken = "9.3"
base64 = "0.22.1" # Add this dependency
http = "1"
once_cell = "1.21.3"
url = "2"
thiserror = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2.5"
fs_extra = "1.3"
tempfile = "3.10"
uuid = { version = "1", features = ["v4"] }
redb = "2.1"
urlencoding = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream", "multipart"] }
matchit = "0.8"
anyhow = "1.0.100"
tokio-util = "0.7.16"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }
arc-swap = "1.7"
ipnetwork = "0.20"
regex = "1.10"

# Multi-content-type parsing support
quick-xml = { version = "0.31", features = ["serialize"] }
csv = "1.3"
multer = "3.0"
encoding_rs = "0.8"
sha2 = "0.10"
lazy_static = "1.4"
bytes = "1.5"
dirs = "5.0"
object_store = { version = "0.12.4", features = ["aws", "http"] }

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
dicom-dictionary-std = "0.9"
dicom-core = "0.9"
tempfile = "3.10"
serial_test = "3.0"
dimse = { path = "crates/dimse" }

