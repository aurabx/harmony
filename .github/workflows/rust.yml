name: Rust
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Ignored advisories need Cargo.toml or toolchain changes, tracked in
    # Linear AURA-2546: quick-xml (RUSTSEC-2026-0194, -0195), rsa
    # (RUSTSEC-2023-0071, dev-dependency, no fix), time (RUSTSEC-2026-0009,
    # fix needs rustc 1.88) and zip (RUSTSEC-2026-0367, -0368, -0369).
    # Remove each --ignore when its fix lands. Any other advisory fails.
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - name: cargo audit
      # RUSTSEC-2023-0071: rsa is dev-only and has no fixed release.
      run: cargo audit --ignore RUSTSEC-2023-0071
    - name: Build
      run: cargo build --verbose --locked
#    - name: Run tests
#      run: cargo test --verbose
